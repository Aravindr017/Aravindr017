<defs>
  <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#12E8FF"/>
    <stop offset="100%" stop-color="#6D4CE0"/>
  </linearGradient>
  <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00F5FF"/>
    <stop offset="100%" stop-color="#B78CFF"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

